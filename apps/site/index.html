<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>TDR:WM</title>
    <meta
      name="description"
      content="A public pool of browser signatures. Measure yours, see what it says, and put it in the commons for anyone to wear."
    />
    <!-- Self-hosted. Root-relative on purpose: Vite rewrites asset URLs in this
         file with the configured base, so this survives the /the-donor-registry/
         prefix GitHub Pages serves the project site under. Do not add
         %BASE_URL% here — it would be prefixed a second time. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <noscript>
      <div class="noscript">
        This page measures your browser in front of you and shows you the result. It needs JavaScript
        to do that, and it does nothing at all without it. That is the honest position: with
        scripting off there is no measurement to show you and nothing has been collected.
      </div>
    </noscript>

    <main id="app" hidden>
      <!-- Filled by src/main.ts. Nothing is rendered before the pool has loaded,
           because every number on this page is stated relative to that pool. -->
    </main>

    <div id="boot" class="boot">
      <p class="boot__line">Loading the pool.</p>
      <p class="boot__note">Nothing has been measured yet.</p>
    </div>

    <!--
      The post-processing layer (§6b).

      It sits in the markup rather than being built by script because it is part of
      the surface the page is drawn on, not part of what the page says: it exists
      before the first render and survives every one after it. Every layer is a
      readout driven by custom properties that ui/post.ts writes from the
      measurement — see styles/post.css for the mapping. With nothing measured, the
      magnitude is zero and what is left is an instrument idling.

      aria-hidden throughout: there is no information here that is not stated in
      words somewhere else on the page.
    -->
    <div id="post" class="post" aria-hidden="true" data-signal="on" data-channel="none">
      <div class="post__vignette"></div>
      <div class="post__scan"></div>
      <div class="post__grain"></div>
      <div class="post__band"></div>
      <div class="post__dropout"></div>
      <div id="flash" class="post__flash"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
