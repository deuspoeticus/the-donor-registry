# The register is printed periodically; the day book is written continuously.
#
# Donations and withdrawals happen the instant the pool service (D1) accepts
# them. `data/pool.json` — and the static `.user.js` next to every entry in
# `data/scripts/` — are the register: a snapshot regenerated here, built into
# the site, deployed, and then thrown away with the runner. Nothing this job
# writes is ever committed. A committed snapshot would make a withdrawn
# identity recoverable from git history forever, by anyone who has ever cloned
# or forked this repository, regardless of what the live site shows — which
# would quietly undo the revocation path that is this project's actual lawful
# basis for holding a fingerprint at all (README, "Privacy and law"). See the
# header of `apps/worker/scripts/publish-pool.ts` for the longer version.
#
# Because nothing here is committed, this job does not need to decide whether
# the pool "changed" before building — it always builds from whatever is
# current in D1 right now and deploys it, the same as `deploy.yml` does for an
# ordinary code push. Concurrency below keeps that cheap and safe to run
# often.
name: Publish the pool

on:
  schedule:
    # Every ten minutes. GitHub may delay or coalesce a schedule under load,
    # especially on the free tier, so treat this as "soon" rather than a
    # guarantee — the day book (D1, the live service) is authoritative in the
    # meantime, and the register is simply how far behind it the static site
    # is allowed to be.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never runs twice at once, and a newer run supersedes an older one: an
# in-progress deploy for a pool that has already moved again is a deploy this
# job will immediately repeat, so there is nothing lost by cancelling it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      # Against the catalogue currently live, fetched from the deployed site —
      # never against the one this job is about to write. See the file header
      # of prune-revoked.ts for why disk is not the source of truth here.
      - name: Forget withdrawals the live catalogue no longer needs
        run: npm run prune:revoked --workspace @wearme/worker -- --remote

      # Writes data/pool.json and data/scripts/*.user.js into the working
      # tree. Neither is committed at any point below — see the file header.
      - name: Regenerate the catalogue and its install links
        run: npm run publish:pool --workspace @wearme/worker -- --remote

      - run: npm run typecheck

      # The site falls back to bootstrap.json when VITE_API_URL is unset,
      # which is correct for a developer and silently wrong for a deployment.
      - name: Require the pool service URL
        run: |
          if [ -z "${{ secrets.VITE_API_URL }}" ]; then
            echo "VITE_API_URL is not set. Add it as a repository secret; without"
            echo "it the built site points at localhost and no visitor can donate,"
            echo "wear or withdraw."
            exit 1
          fi

      # Reads the data/pool.json and data/scripts/ just written above — Vite's
      # publicDir is data/, so the freshly generated files ship as they are,
      # uncommitted, and are gone with this runner once the job ends.
      - run: npm run build --workspace @wearme/site
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
