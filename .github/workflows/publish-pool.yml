# The weekly build (deck §16).
name: Publish the pool

# Donations enter the published catalogue here and nowhere else. The service
# accepts a donation the moment it is made — the donor's own browser shows it
# back to them straight away, marked as unpublished — but it is this job that
# makes the entry visible to anybody else.
#
# Withdrawals do not wait for this. Revocation deletes the entry from the pool
# immediately and the service serves the withdrawn ids so the site can filter
# the static catalogue against them. This job is what eventually makes that
# filtering unnecessary.
on:
  schedule:
    # Mondays, 09:00 UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  # `contents: write` to commit the regenerated catalogue; the other two are
  # required by the deploy workflow this one calls, and a called workflow
  # cannot hold permissions its caller has not granted.
  contents: write
  pages: write
  id-token: write

# Never runs twice at once. Not cancelled in progress: a half-finished run
# could have pruned withdrawals without publishing the catalogue that made
# pruning safe.
concurrency:
  group: publish-pool
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      # Against the catalogue that is live right now, before it is replaced.
      # Pruning against the file this job is about to write would drop the
      # filter for entries the deployed catalogue still lists.
      - name: Forget withdrawals the live catalogue no longer needs
        run: npm run prune:revoked --workspace @wearme/worker -- --remote

      # Rewrites data/pool.json only if the pool actually changed, so the
      # working tree being dirty is the whole publication decision.
      - name: Regenerate the catalogue
        run: npm run publish:pool --workspace @wearme/worker -- --remote

      - name: Commit, if the pool changed
        id: commit
        run: |
          # `git status --porcelain`, not `git diff`: on the first run the
          # catalogue is untracked, and `git diff` reports an untracked file as
          # no change — which would leave the first pool ever published sitting
          # uncommitted, and every run after it reporting nothing to do.
          if [ -z "$(git status --porcelain -- data/pool.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The pool is unchanged since the last build. Nothing to publish."
            exit 0
          fi
          count=$(node -p "require('./data/pool.json').count")
          donated=$(node -p "require('./data/pool.json').stats.donatedCount")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pool.json
          git commit -m "Publish the pool: ${count} entries, ${donated} donated"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Only when there is something new to serve. An unchanged pool does not need
  # redeploying, and a deploy that changes nothing is noise in the record of a
  # piece whose build history is part of what it publishes.
  deploy:
    needs: publish
    if: needs.publish.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
