name: Deploy to GitHub Pages

# For an ordinary code push. `publish-pool.yml` (the scheduled catalogue
# refresh) is a separate, self-contained workflow rather than a caller of this
# one: it needs the freshly generated, uncommitted data/pool.json and
# data/scripts/ still on disk when it builds, and a workflow_call runs as its
# own job on its own runner, which would lose exactly that. The two workflows
# share the "pages" concurrency group below, so they still can't deploy over
# each other. A push here builds from whatever data files happen to be
# committed or already on disk — in practice `data/bootstrap.json` and its
# matching seed scripts, since the live pool's snapshot is never committed —
# and the next scheduled run catches the deployed site back up to D1.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck

      # The site falls back to http://127.0.0.1:8787 when VITE_API_URL is unset,
      # which is correct for a developer and silently wrong for a deployment:
      # the build would succeed, ship, and tell every visitor the pool service
      # was unreachable. Failing here is the cheap version of that discovery.
      - name: Require the pool service URL
        run: |
          if [ -z "${{ secrets.VITE_API_URL }}" ]; then
            echo "VITE_API_URL is not set. Add it as a repository secret; without"
            echo "it the built site points at localhost and no visitor can donate,"
            echo "wear or withdraw."
            exit 1
          fi

      - run: npm run build --workspace @wearme/site
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
