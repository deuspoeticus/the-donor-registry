<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="WEAR ME">
  <!--
    Three steles on the dark plane: the field, reduced to the smallest mark that
    still reads at sixteen pixels. Heights are uneven because the field is —
    magnitude is surprisal, and a rank of identical bars would be the one thing
    the piece is about not being true.

    Self-hosted and monochrome, per the site's own rule: no third-party request
    is made for anything on this page, including its lettering and its icon.
  -->
  <rect width="32" height="32" fill="#08080a"/>
  <rect x="6"  y="14" width="4" height="12" fill="#d8d4c8"/>
  <rect x="14" y="7"  width="4" height="19" fill="#d8d4c8"/>
  <rect x="22" y="18" width="4" height="8"  fill="#8a8a94"/>
</svg>
